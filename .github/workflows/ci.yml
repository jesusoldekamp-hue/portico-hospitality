name: CI — Pruebas Portico Hospitality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Ejecutar suite de pruebas (CURP, RBAC, PUI DOF, Outbox y Agente PMS)
        run: npm test
